<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สายเลื่อย 🪚</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font-family:system-ui,sans-serif;text-align:center}
h1{margin:18px 0 4px;font-size:34px}p{margin:4px 0 12px;color:#b8c5cc}
#score{font-size:22px;font-weight:700;margin:8px}
canvas{display:block;margin:10px auto;border:4px solid #f5c542;border-radius:14px;background:#18252d;max-width:92vw;height:auto}
button{border:0;border-radius:12px;background:#f5c542;color:#101820;font-size:20px;font-weight:800;padding:11px 20px;margin:5px;cursor:pointer}
.pad{display:grid;grid-template-columns:65px 65px 65px;grid-template-rows:55px 55px;margin:8px auto;width:max-content;gap:5px}
.pad button{margin:0;padding:0;font-size:24px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
small{color:#9eacb4}
</style>
</head>
<body>
<h1>🪚 สายเลื่อย</h1>
<p>เกมงูเก็บเฟือง — กินเฟืองให้ได้คะแนนมากที่สุด!</p>
<div id="score">คะแนน: 0</div>
<canvas id="game" width="420" height="420"></canvas>
<button id="start">เริ่มเกม / เล่นใหม่</button>
<div class="pad">
<button class="up" data-d="up">▲</button>
<button class="left" data-d="left">◀</button>
<button class="down" data-d="down">▼</button>
<button class="right" data-d="right">▶</button>
</div>
<small>คอมพิวเตอร์: ปุ่มลูกศรหรือ WASD • มือถือ: ใช้ปุ่มด้านล่าง</small>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),N=21,S=c.width/N;
let snake,food,dir,next,score,running=false,timer;
function reset(){
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;
 score=0;document.getElementById('score').textContent='คะแนน: 0';placeFood();draw();
}
function placeFood(){
 do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
 while(snake.some(a=>a.x===food.x&&a.y===food.y));
}
function setDir(d){
 const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
 const q=m[d];if(q.x!==-dir.x||q.y!==-dir.y)next=q;
}
function step(){
 dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(a=>a.x===h.x&&a.y===h.y)){gameOver();return}
 snake.unshift(h);
 if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent='คะแนน: '+score;placeFood()}
 else snake.pop();
 draw();
}
function draw(){
 x.clearRect(0,0,c.width,c.height);
 x.strokeStyle='#20343d';x.lineWidth=1;
 for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}
 // food = gear
 x.fillStyle='#f5c542';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.27,0,Math.PI*2);x.fill();
 x.fillStyle='#101820';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.1,0,Math.PI*2);x.fill();
 snake.forEach((a,i)=>{x.fillStyle=i===0?'#e85d04':'#ff8c42';x.fillRect(a.x*S+3,a.y*S+3,S-6,S-6)});
}
function start(){clearInterval(timer);reset();running=true;timer=setInterval(step,115)}
function gameOver(){running=false;clearInterval(timer);x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='bold 38px system-ui';x.textAlign='center';x.fillText('เกมจบ!',c.width/2,c.height/2-10);x.font='22px system-ui';x.fillText('คะแนน '+score,c.width/2,c.height/2+30)}
document.getElementById('start').onclick=start;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(running)setDir(b.dataset.d)});
addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k){e.preventDefault();if(running)setDir(k)}});
reset();
</script>
</body>
</html>
